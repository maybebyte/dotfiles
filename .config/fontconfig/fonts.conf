<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Font settings for all fonts -->
  <match target="font">
    <edit mode="assign" name="antialias">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="autohint">
      <bool>false</bool>
    </edit>
    <edit mode="assign" name="hinting">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="hintstyle">
      <const>hintslight</const>
    </edit>
  </match>
  <!--
    If rgba is unset or unknown, use grayscale antialiasing.

    Subpixel rendering assumes one panel geometry, which is wrong
    with mixed displays and undetectable from a Qubes VM; grayscale
    is correct everywhere. A desktop-set subpixel order still wins.
  -->
  <match target="font">
    <test qual="all" name="rgba">
      <const>unknown</const>
    </test>
    <edit mode="assign" name="rgba">
      <const>none</const>
    </edit>
  </match>
  <!-- serif -->
  <match>
    <test name="family">
      <string>serif</string>
    </test>
    <edit mode="prepend" binding="strong" name="family">
      <string>Noto Serif</string>
      <string>Noto Color Emoji</string>
      <string>Font Awesome 6 Free</string>
      <string>Font Awesome 6 Brands</string>
    </edit>
  </match>
  <!-- sans-serif -->
  <match>
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit mode="prepend" binding="strong" name="family">
      <string>Atkinson Hyperlegible Next</string>
      <string>Atkinson Hyperlegible</string>
      <string>Noto Sans</string>
      <string>Noto Color Emoji</string>
      <string>Font Awesome 6 Free</string>
      <string>Font Awesome 6 Brands</string>
    </edit>
  </match>
  <!-- monospace -->
  <match>
    <test name="family">
      <string>monospace</string>
    </test>
    <edit mode="prepend" binding="strong" name="family">
      <string>AtkynsonMono Nerd Font</string>
      <string>Atkinson Hyperlegible Mono</string>
      <string>Noto Color Emoji</string>
      <string>Font Awesome 6 Free</string>
      <string>Font Awesome 6 Brands</string>
    </edit>
  </match>
</fontconfig>
